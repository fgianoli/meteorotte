server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/xml application/atom+xml application/javascript text/css image/svg+xml;
    server_tokens off;
    access_log off;   # nessun log degli accessi: nessuna traccia di chi consulta le allerte

    # dati prodotti dal worker (sola lettura)
    location /api/ {
        alias /data/public/;
        types { application/json json; application/cap+xml xml; application/atom+xml atom; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # notifiche push: inoltro al servizio "push" (risolto a ogni richiesta, così nginx parte anche se è spento)
    location /push/ {
        resolver 127.0.0.11 valid=30s;
        set $push_upstream http://push:3000;
        proxy_pass $push_upstream;
        client_max_body_size 16k;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
