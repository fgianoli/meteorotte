<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeteoRotte – allerte meteo lungo le rotte</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f172a; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
          --l0:#16a34a; --l1:#eab308; --l2:#f97316; --l3:#dc2626; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Ethiopic", sans-serif; color:var(--ink); }
  body { display:grid; grid-template-rows:auto 1fr; }
  header { background:var(--bg); color:#fff; display:flex; align-items:center; gap:12px; padding:8px 12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .sp { flex:1; }
  header select, header button { font:inherit; font-size:14px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#fff; padding:5px 8px; }
  #status { font-size:12px; color:#cbd5e1; }
  main { display:grid; grid-template-columns: 380px 1fr; min-height:0; }
  #map { min-height:0; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; min-height:0; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; padding:10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:2; }
  .chip { border:1px solid var(--line); background:#f8fafc; border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .chip.on { background:var(--bg); color:#fff; border-color:var(--bg); }
  .site { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start; }
  .site:hover, .site.sel { background:#f1f5f9; }
  .dot { width:12px; height:12px; border-radius:50%; margin-top:4px; flex:none; }
  .site b { font-size:14px; display:block; }
  .site small { color:var(--muted); font-size:12px; }
  .hz { font-size:13px; margin-top:2px; }
  #detail { padding:12px; border-bottom:6px solid #f1f5f9; display:none; }
  #detail h2 { font-size:16px; margin:0 0 4px; }
  #detail .note { font-size:12.5px; color:var(--muted); margin:0 0 8px; }
  table.hzt { width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 10px; }
  table.hzt td { padding:4px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .msg { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14.5px; line-height:1.5; }
  .msg[dir=rtl] { text-align:right; font-family: "Noto Naskh Arabic", "Noto Nastaliq Urdu", system-ui, sans-serif; font-size:16px; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .btn { font:inherit; font-size:13px; border:1px solid var(--bg); background:var(--bg); color:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--bg); }
  .links a { font-size:12.5px; margin-right:10px; color:#1d4ed8; }
  .warn { font-size:11.5px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:6px 8px; margin:8px 0; }
  .legend { background:#fff; padding:6px 8px; border-radius:8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); line-height:1.6; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  .radarctl { background:#fff; padding:6px 8px; border-radius:8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); display:none; align-items:center; gap:6px; }
  .radarctl input { width:140px; }
  .wind-arrow { font-size:12px; font-weight:700; color:#0f172a; text-shadow:0 0 3px #fff, 0 0 3px #fff; white-space:nowrap; }
  .wind-arrow span { display:inline-block; font-size:18px; line-height:1; }
  .tlh { font-size:12px; font-weight:600; margin-top:6px; display:flex; justify-content:space-between; } .tlh span { font-weight:400; color:var(--muted); }
  .tl { display:flex; height:16px; border-radius:4px; overflow:hidden; margin:3px 0 4px; } .tl i { flex:1; }
  .poster { position:fixed; inset:0; z-index:5000; background:#fff; display:flex; flex-direction:column; }
  .poster .ph { font-size:clamp(22px,4vw,46px); font-weight:700; padding:16px 24px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .poster .pb { flex:1; overflow:auto; padding:8px 28px; font-size:clamp(22px,3.4vw,40px); line-height:1.4; }
  .poster .pf { display:flex; gap:16px; align-items:center; padding:10px 24px; font-size:14px; color:#475569; border-top:1px solid var(--line); }
  @media print { .noprint, body > *:not(.poster) { display:none !important; } .poster { position:static; } }
  .poi { font-size:18px; line-height:24px; text-align:center; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .modal { position:fixed; inset:0; z-index:6000; background:rgba(15,23,42,.6); display:flex; align-items:center; justify-content:center; padding:12px; }
  .mbox { background:#fff; border-radius:12px; padding:16px 18px; max-width:620px; max-height:92vh; overflow:auto; font-size:14px; line-height:1.45; }
  .mbox h2 { margin:0 0 6px; font-size:18px; } .mbox ul { padding-left:18px; margin:6px 0; } .mbox li { margin-bottom:6px; }
  .mbox .en, .mbox .src { font-size:12px; color:var(--muted); }
  .fact { font-size:12.5px; color:#334155; margin:2px 0; } .fact span { color:var(--muted); }
  svg.spark { width:100%; height:90px; display:block; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    #map { order:1; } aside { order:2; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>🛟 MeteoRotte</h1>
  <span id="status" data-t="loading">Caricamento…</span>
  <span class="sp"></span>
  <label style="font-size:13px"><span data-t="msgLang">Lingua messaggio</span>
    <select id="lang"></select>
  </label>
  <button id="push" hidden>🔔</button>
  <button id="info" data-t="info">ⓘ Avvertenze</button>
  <button id="refresh" data-t="refresh">⟳ Aggiorna</button>
  <select id="uilang" title="Interface language"></select>
</header>
<main>
  <aside>
    <div class="filters" id="filters"></div>
    <div id="detail"></div>
    <div id="list"></div>
    <div class="warn" style="margin:12px" data-t="footer"></div>
  </aside>
  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/hotspots.js"></script>
<script src="data/shelters.js"></script>
<script src="data/aiuti.js"></script>
<script src="js/ui-i18n.js"></script>
<script src="js/i18n.js"></script>
<script src="js/alerts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
